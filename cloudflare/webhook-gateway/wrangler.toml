# Fila de entrada dos webhooks. Guia: docs/fila-de-entrada.md
# Publicado pelo workflow .github/workflows/cloudflare-deploy.yml:
#   push na develop -> --env develop     (Worker "develop", fila unxet-entrada-develop)
#   push na main    -> --env production  (Worker "producao", fila unxet-entrada)
# Endereços: https://<worker>.unxet-entrada.workers.dev

name = "producao"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[env.develop]
name = "develop"
vars = { ENVIRONMENT = "develop", SUPABASE_FUNCTIONS_URL = "https://ketolvqnptmdczkzrqba.supabase.co/functions/v1" }

# Guarda os logs no painel (Workers -> Logs). Sem isso só dá para ver ao vivo,
# com o painel ou o `wrangler tail` abertos na hora.
[env.develop.observability]
enabled = true

[[env.develop.queues.producers]]
binding = "INBOUND"
queue = "unxet-entrada-develop"

[[env.develop.queues.consumers]]
queue = "unxet-entrada-develop"
max_batch_size = 10
max_batch_timeout = 1
max_concurrency = 3
# 100 tentativas com espera crescente (até 15 min) cobrem cerca de 24 h
max_retries = 100
dead_letter_queue = "unxet-entrada-develop-falhas"

[env.production]
name = "producao"
vars = { ENVIRONMENT = "production", SUPABASE_FUNCTIONS_URL = "https://karmtrldanuxqisgzlhk.supabase.co/functions/v1" }

# Guarda os logs no painel (Workers -> Logs). Sem isso só dá para ver ao vivo,
# com o painel ou o `wrangler tail` abertos na hora.
[env.production.observability]
enabled = true

[[env.production.queues.producers]]
binding = "INBOUND"
queue = "unxet-entrada"

[[env.production.queues.consumers]]
queue = "unxet-entrada"
max_batch_size = 10
max_batch_timeout = 1
max_concurrency = 3
max_retries = 100
dead_letter_queue = "unxet-entrada-falhas"
